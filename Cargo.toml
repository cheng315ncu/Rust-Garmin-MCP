[package]
name = "garmin-mcp"
version = "0.1.0"
edition = "2021"
# GPL-3.0 because this links garmin_client, which is GPL-3.0. See LICENSING in
# the README — the obligation comes from the dependency, not from a choice made
# for the code in src/.
license = "GPL-3.0"

[[bin]]
name = "garmin-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "1", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Vendored fork of garmin_client 0.2.1. Upstream reads the MFA code from stdin,
# which cannot work here because stdin carries the MCP transport; the fork adds
# TOTP-based non-interactive MFA. See vendor/garmin_client/src/totp.rs.
garmin_client = { path = "vendor/garmin_client" }
schemars = { version = "0.8", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
moka = { version = "0.12", features = ["future"] }
governor = "0.6"
dotenvy = "0.15"
chrono = "0.4"
